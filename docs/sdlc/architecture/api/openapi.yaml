          type: string
          format: date-time
      required:
      - id
      - email
      - password_hash
      - currency
      - email_alerts_opt_in
      - created_at
    sessions:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - created_at
      - expires_at
    categories:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - name
      - is_default
      - created_at
    expenses:
